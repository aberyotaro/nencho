# config.toml にコピーして空欄を埋め、./run.sh を実行する。
# マイナンバーの欄は出力しない。

[payer]                      # 給与の支払者（事業所）
name    = ""                  # 名称（氏名）　例: 山田企画
address = ""                  # 所在地（住所）　例: 東京都千代田区〇〇1-2-3

[office]                     # 提出先の欄
zeimusho    = ""              # 所轄税務署長 欄（「税務署」は付けない）　例: 麹町
shikuchoson = ""              # 市区町村長 欄（扶養控除等申告書のみ）　例: 千代田区

[employee]                   # 従業員（申告書を出す人）
name      = ""                # 氏名　例: 山田 花子
furigana  = ""                # フリガナ（カタカナ）
birth_era = ""                # 生年月日の元号: 明治 / 大正 / 昭和 / 平成 / 令和
birth_y   = ""                # 元号の年（数字）
birth_m   = ""                # 月
birth_d   = ""                # 日
postal    = ""                # 郵便番号　例: 100-0001（扶養控除等申告書のみ。空欄可）
address   = ""                # 住所又は居所
head_of_household = ""        # 世帯主の氏名
relation  = ""                # 従業員から見た世帯主の続柄　例: 夫 / 本人
has_spouse = "有"             # 配偶者の有無: 有 / 無

[income]                     # 基礎控除申告書（令和8年分）用
salary_revenue = 0            # 令和8年の給与の収入金額（年間見込み・円）　例: 1500000
other_income   = 0            # 給与所得以外の所得の合計額（円）

[options]
font_path = ""                # 空欄なら fonts/ の同梱フォントを使う
